# Typecheck, lint and the full test suite on every push to main and every PR. Tests use fakes
# only (no API keys); the database matches docker-compose (pgvector, Postgres 16).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spica
          POSTGRES_PASSWORD: spica
          POSTGRES_DB: spica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spica" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://spica:spica@localhost:5432/spica_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
