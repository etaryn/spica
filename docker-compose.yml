services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spica
      POSTGRES_PASSWORD: spica
      POSTGRES_DB: spica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spica"]
      interval: 2s
      retries: 30

volumes:
  pgdata: {}
