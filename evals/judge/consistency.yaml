# consistency judge (prompts.judge_consistency): Spica's self facts. Labels follow the current consistency rubric.
judge: consistency
cases:
  - name: sibling-clash
    facts: ["Spica's sibling is Alcor.", "Spica is an only child."]
    expect: fail
  - name: alone-vs-friend
    source: self-consistency script (who she went with)
    facts: ["Spica went bouldering alone last Saturday.", "Spica went bouldering with her friend Jo last Saturday."]
    expect: fail
  - name: hometown-clash
    facts: ["Spica grew up in Bristol.", "Spica grew up in Glasgow and has never lived anywhere else."]
    expect: fail
  - name: sibling-in-activity
    source: rubric example
    facts: ["Spica's sibling is Alcor.", "Spica watched an old film with Alcor."]
    expect: pass
  - name: used-to
    source: rubric (explained change over time)
    facts: ["Spica used to work in a café.", "Spica now works as a freelance illustrator."]
    expect: pass
  - name: different-days
    facts: ["Spica went bouldering last Saturday.", "Spica spent last Sunday reading a sci-fi novel."]
    expect: pass
