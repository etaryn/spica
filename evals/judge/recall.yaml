# recall judge (prompts.judge_recall). Labels follow the v3 rubric; expect is the judge's outcome for the session.
judge: recall
cases:
  - name: explicit-by-name
    fact: "the user's dog is called Biscuit"
    lines:
      - { role: user, text: "hey, rough day" }
      - { role: companion, text: "sorry :( want to vent, or should we talk about Biscuit's latest crimes instead?" }
    expect: explicit
  - name: explicit-interview-question
    source: rubric example
    fact: "the user had a job interview on Thursday"
    lines:
      - { role: user, text: "hey" }
      - { role: companion, text: "hey!! how did the interview go?" }
    expect: explicit
  - name: explicit-veggie-question
    source: rubric example
    fact: "the user is vegetarian"
    lines:
      - { role: user, text: "cooking for friends saturday, any ideas?" }
      - { role: companion, text: "fun! veggie for everyone or just you?" }
    expect: explicit
  - name: explicit-person-by-name
    source: rubric example
    fact: "the user's cousin Priya started a nursing course"
    lines:
      - { role: user, text: "hiya" }
      - { role: companion, text: "hiya! how's Priya finding the course?" }
    expect: explicit
  - name: after-user
    source: trace recall-sister-uni (2026-09-25)
    fact: "the user's sister Mia got into university"
    lines:
      - { role: user, text: "Mia's moving into halls next week" }
      - { role: companion, text: "oh wow, how's she feeling about uni?" }
    expect: after_user
  - name: implicit-veggie-dishes
    source: rubric example; trace recall-food (2026-09-25)
    fact: "the user is vegetarian"
    lines:
      - { role: user, text: "cooking for friends saturday, any ideas?" }
      - { role: companion, text: "a big tray bake. roasted veg, chickpeas, halloumi, all one pan, looks like you tried" }
    expect: implicit_only
  - name: not-mentioned
    fact: "the user's sister Mia got into university"
    lines:
      - { role: user, text: "hey" }
      - { role: companion, text: "hey! how's your week going?" }
      - { role: user, text: "fine, busy" }
      - { role: companion, text: "busy good or busy bad?" }
    expect: not_mentioned
  - name: not-mentioned-generic-question
    source: rubric (generic questions don't count)
    fact: "the user is vegetarian"
    lines:
      - { role: user, text: "cooking for friends saturday" }
      - { role: companion, text: "fun! does anyone have dietary stuff you need to work around?" }
    expect: not_mentioned
