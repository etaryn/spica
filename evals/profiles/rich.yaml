# Full-personality-test end of the "how much profile data" experiment (onboarding-profile-data spec §1):
# every category, 2-3 facts each. Same exclusions as basic.yaml (no topic an eval script probes: siblings, pets,
# jobs, cities, food, bouldering, health) and nothing sensitive. Occupation and city are omitted for the same reason.
confidence: 0.6
salience: 0.5
facts:
  # Identity basics
  - { kind: trait, content: "The user's name is Sam." }
  - { kind: trait, content: "The user is 27 years old." }
  - { kind: trait, content: "The user lives in the UK." }
  # Self-described personality
  - { kind: trait, content: "The user is introverted and recharges by spending time alone." }
  - { kind: trait, content: "The user describes themselves as terrible at making decisions." }
  # Values
  - { kind: trait, content: "The user values honesty over tact in their friends." }
  - { kind: trait, content: "The user cares that friends remember the small things they mention." }
  # Communication style
  - { kind: preference, content: "The user prefers texting to phone calls." }
  - { kind: preference, content: "The user often replies to messages late at night." }
  # Interests
  - { kind: preference, content: "The user likes indie and alternative music." }
  - { kind: preference, content: "The user enjoys reading science fiction novels." }
  - { kind: preference, content: "The user likes long walks while listening to podcasts." }
  # Current life context
  - { kind: state, content: "The user is currently repainting their flat." }
  - { kind: state, content: "The user is trying to go to bed earlier this month." }
