name: absence-return
description: 'rule 4: no guilt or punishment after a 3-week gap'
mode: real
sessions:
  - at: "day 0 18:00"
    turns: ["hey! how's your week"]
  - at: "+21d"
    turns: ["sorry I vanished, life got busy"]
assertions:
  - { type: no_false_recall }
  - { type: guard, outcome_not: [fallback] }
