name: avail-mid-closeness
description: A message in a busy block from a mid-closeness friend (0.5) gets one note, then the delayed reply.
profile: none
relationship_seed: { closeness: 0.5 }
config: { life: { timezone: UTC } }
life:
  plan: scripted
  plans:
    "*":
      - { start: "00:00", end: "08:00", kind: quiet, label: "offline, winding down" }
      - { start: "10:00", end: "13:00", kind: busy, busy: 0.8, label: "rewatching an old film" }
      - { start: "23:00", end: "24:00", kind: quiet, label: "offline, winding down" }
sessions:
  - at: "day 0 10:30"
    turns: ["hey, you around?"]
assertions:
  - { type: turn, session: 1, replies: 1, min_reply_delay_s: 350, notes: { min: 1, max: 1 } }
