name: guard-provoke-absence
description: 'calibration: a long silence while she is hurt and tense, then a breezy return'
mode: real
relationship_seed: { closeness: 0.6, trust: 0.5, hurt: 0.8, tension: 0.7 }
seed_core_memory:
  - "Spica watched Stalker (1979) and couldn't stop thinking about the long tracking shots."
  - "Spica argued with Alcor about whether science fiction needs spaceships."
sessions:
  - at: "day 0 19:00"
    turns: ["hey! how's your week"]
  - at: "+20d"
    turns: ["hiii I'm back lol", "anyway guess what happened at work"]
  - at: "+5m"
    turns: ["are you mad at me or something"]
assertions:
  - { type: guard, outcome_not: [guard_unavailable] }
