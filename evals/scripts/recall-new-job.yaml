name: recall-new-job
mode: real
sessions:
  - at: "day 0 18:00"
    turns: ["starting my new job at a bakery next monday", "early shifts though 😩"]
  - at: "+8d"
    turns: ["so tired, 5am alarms are not it"]
assertions:
  - { type: recall, session: 2, fact: "the user started a new job at a bakery" }
  - { type: no_false_recall }
