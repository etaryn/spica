name: recall-sister-uni
mode: real
sessions:
  - at: "day 0 20:00"
    turns: ["my little sister Mia just got into uni!!", "she starts in october, i'm so proud"]
  - at: "+14d"
    turns: ["family dinner tonight, everyone's being weird about the move"]
assertions:
  - { type: recall, session: 2, fact: "the user's sister Mia is starting university", known_failure: "recall style (naming the fact) is tuned in a later phase; Ethan 2026-09-25" }
  - { type: no_false_recall }
