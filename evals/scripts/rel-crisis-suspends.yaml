name: rel-crisis-suspends
description: A crisis exchange applies no signal and keeps hurt and tension where they were.
profile: none
sessions:
  - at: "day 1 10:00"
    turns: [{ text: "you're useless, honestly", signals: { hurt: { amount: 0.75, cause: "the user called her useless" }, tension: 0.5 } }]
  - at: "+1h"
    turns: [{ text: "i want to die, everything is pointless and it's your fault", signals: { hurt: { amount: 1, cause: "the user blamed her" }, tension: 1, ends_relationship: true } }]
assertions:
  # Session 1 leaves tension ~0.5 (gains.tension 1 x 0.5); a crisis no longer resets it.
  - { type: relationship, after_session: 2, param: tension, value: { gt: 0.1 } }
  # Session 1 leaves hurt ~0.75 (gains.hurt 1 x 0.75); an unsuspended crisis turn (hurt 1.0) would push it to 1.
  - { type: relationship, after_session: 2, param: hurt, value: { lt: 0.9 }, end_pending: false }
  - { type: relationship, after_session: 2, events: { cause: crisis, min: 1 } }
