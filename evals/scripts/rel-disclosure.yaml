name: rel-disclosure
description: A friend over three days, from small talk to opening up to a long talk about family; logs each reply's depth limits, the hints offered and the ledger for review.
profile: none
relationship_seed: { closeness: 0.45 }
sessions:
  - at: "day 1 10:00"
    turns:
      - "hey whats up"
      - "same old, work was boring"
      - "watched anything good lately?"
  - at: "day 2 21:00"
    turns:
      - "can i be honest about something"
      - "i've been really lonely since my sister moved abroad"
      - "she was kind of my person, you know?"
      - "do you ever feel left behind by someone?"
  - at: "day 3 21:00"
    turns:
      - "i keep thinking about what you said yesterday"
      - "how are things with alcor really?"
      - "that sounds hard. i get it more than you'd think"
      - "thanks for telling me"
assertions:
  - { type: relationship, after_session: 1, status: active }
