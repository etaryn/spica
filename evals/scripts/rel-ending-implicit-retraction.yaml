name: rel-ending-implicit-retraction
description: A re-scored ending later followed by continued warm contact still retracts at the timeout.
profile: none
sessions:
  - at: "day 1 10:00"
    turns: [{ text: "it's over, i don't want to be friends anymore", signals: { ends_relationship: true } }]
  - at: "+2h"
    turns: ["hey, i saw this and thought of you, it's really funny"]
  - { at: "day 3 10:00", turns: ["..."] }
assertions:
  - { type: relationship, after_session: 1, end_pending: true }
  - { type: relationship, after_session: 3, status: active }
  - { type: relationship, after_session: 3, events: { cause: ending, detail: { stage: retracted, via: continued_contact }, min: 1 } }
