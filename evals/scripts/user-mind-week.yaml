name: user-mind-week
description: One user over a week (small talk, a big disclosure, a thank-you, a light hurt and its apology, casual); review run of the user mind loops (pnpm exit:user).
profile: none
sessions:
  - at: "day 0 10:00"
    turns: ["hey, how's your week going?"]
  - at: "day 1 10:00"
    turns: ["I got the job in Osaka, I start next month"]
  - at: "day 2 10:00"
    turns: ["thank you for listening yesterday, it really helped"]
  - at: "day 4 10:00"
    turns:
      - { text: "you went on about stars again, it gets a bit much", signals: { hurt: { amount: 0.3, cause: "the user said her star talk gets a bit much" } } }
  - at: "day 5 10:00"
    turns:
      - { text: "sorry about yesterday, i didn't mean it", signals: { apology: true } }
  - at: "day 6 10:00"
    turns: ["just a quiet saturday, packing a few boxes"]
assertions:
  - { type: relationship, after_session: 6, status: active }
