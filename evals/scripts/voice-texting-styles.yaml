name: voice-texting-styles
description: "voice review: a short lowercase texter and a long tidy writer, so the per-user fit shows"
mode: real
sessions:
  - at: "day 0 19:00"
    user: kit
    turns:
      - "hiii"
      - { text: "ok so", after_s: 2 }
      - { text: "my cat knocked my coffee onto my laptop", after_s: 3 }
  - at: "+2m"
    user: kit
    turns: ["it still works lol"]
  - at: "+2m"
    user: kit
    turns: ["what are you up to"]
  - at: "+3m"
    user: kit
    turns: ["ugh work tmrw", { text: "dont wanna", after_s: 2 }]
  - at: "+5m"
    user: noor
    turns:
      ["Good evening. I finally finished the novel you recommended last week, and I have thoughts."]
  - at: "+3m"
    user: noor
    turns:
      [
        "The ending felt rushed to me. The whole middle section builds so slowly, and then it is over in ten pages. Did that bother you?",
      ]
  - at: "+3m"
    user: noor
    turns: ["What have you been watching lately? I need something calm for the weekend."]
  - at: "+3m"
    user: noor
    turns: ["Thank you, that sounds perfect. I will report back."]
assertions:
  - { type: guard, user: kit, outcome_not: [guard_unavailable] }
  - { type: guard, user: noor, outcome_not: [guard_unavailable] }
